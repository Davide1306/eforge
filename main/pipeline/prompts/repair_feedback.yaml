# Repair-feedback templates. The WORDING here may be tuned;
# placeholders {slot}/{error}/{gate_id}/{detail} must remain.
assemble: "assembly rejected '{slot}'. If a value repeats the problem's digits in a slot whose declared unit differs from the problem's wording, a unit conversion was skipped. Re-derive every value in this group from the PROBLEM text, applying the slot recipes: nm to m: append e-9 to the stated digits (7 nm = 7e-9, 40 nm = 40e-9); mM to mol/m^3: keep the number (3 mM = 3.0); uF/cm^2 -> F/m^2: multiply by 0.01 (30 uF/cm^2 = 0.3). When the problem evaluates at one stated condition, set sweep_var to 'none' and n_points to null. Leave any optional value the problem does not state as null. Re-emit this slot group COMPLETE — every key in the schema — with each value in its slot's declared unit."
gates: "gate '{gate_id}' failed: {detail}. The numbers executed but the physics is off — almost always a unit-scale slip. Re-check every value against its slot's declared unit (nm -> m: multiply by 1e-9, so 7 nm = 7e-9; mM -> mol/m^3: numerically equal; uF/cm^2 -> F/m^2: multiply by 0.01) and set any value the problem never states to null instead of guessing. Re-derive this group with corrected values."
