# Pipeline configuration — single source of truth for model serving + policy.
# Switch profiles with the PIPELINE_PROFILE env var or the harness --profile flag.

active_profile: openai_example

profiles:
  # Deterministic fixture client — NO network, NO model. Exercises the graph
  # mechanics end-to-end offline. Answers derive from
  # eval/reference/ground_truth_fills.yaml. Used by `--profile mock`.
  mock:
    kind: mock
    json_mode: plain

  # Bring your own OpenAI-compatible endpoint: set base_url + model, and point
  # api_key_env at an environment variable holding your key. Keep json_mode: plain
  # — schema-constrained ("guided") decoding omits optional fields and distorts
  # numerics; plain returns clean JSON content.
  openai_example:
    kind: openai
    base_url: "https://api.your-provider.example/v1"
    model: "your-model-name"
    api_key_env: "OPENAI_API_KEY"
    json_mode: plain
    temperature: 0
    max_tokens: 4096
    timeout_s: 900
    reasoning_effort: {selector: low, slot_filler: high, cross_checker: low}

policy:                        # pipeline policy knobs
  retry_budget: 2              # re-asks per slot-group on validation failure
  fewshot_count: 1             # few-shot examples per filler call (0, 1, 2)
  chunk_mode: per_group        # per_group | per_slot | merged
  cross_check: false           # cross_checker second pass OFF (settled)
  repair_max_rounds: 2         # executor/gate failures routed back to filler
